version: "3.8"

services:
  oracle-db:
    image: gvenzl/oracle-xe:latest
    container_name: oracle-db
    restart: always
    ports:
      - "1521:1521" # Oracle SQL*Net
      - "5500:5500" # Oracle Enterprise Manager
    environment:
      ORACLE_PASSWORD: root # Change to a strong password
      ORACLE_ALLOW_REMOTE: "true"
      ORACLE_DATABASE: DS_Practicals
      ORACLE_PDB: ORCLPDB1
    volumes:
      - ~/oracle-data:/opt/oracle/oradata # Persistent data directory
    command:
      [
        "/bin/sh",
        "-c",
        "chmod -R 777 /opt/oracle/oradata && exec docker-entrypoint.sh",
      ]

  mssql-server:
    image: mcr.microsoft.com/mssql/server
    container_name: mssql-server
    restart: always
    ports:
      - "1433:1433" # MS SQL Server default port
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "StrongPassword123!" # Change to a strong password
    volumes:
      - ~/mssql-data:/var/opt/mssql
    # command: ["sudo", "chmod", "-R", "777", "~/mssql-data"] # Persistent data directory

  mssql-client:
    image: mcr.microsoft.com/mssql-tools
    container_name: mssql-client
    depends_on:
      - mssql-server
    stdin_open: true
    tty: true
    command: ["/bin/bash"]

  # sqlplus:
  #   image: store/oracle/database-instantclient:latest
  #   container_name: sqlplus-client
  #   depends_on:
  #     - oracle-db
  #   stdin_open: true
  #   tty: true
  #   environment:
  #     TNS_ADMIN: /oracle
  #   volumes:
  #     - ~/oracle-config:/oracle
  #   command: ["/bin/bash"]

volumes:
  oracle-data:
  oracle-config:
  mssql-data:
